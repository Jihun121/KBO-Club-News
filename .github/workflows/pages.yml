name: Deploy Club News to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'worker/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: club-news-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate site configuration and scripts
        run: |
          node --check site/app.js
          node --check worker/src/index.js
          node -e "JSON.parse(require('fs').readFileSync('site/config/teams.json','utf8'))"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
