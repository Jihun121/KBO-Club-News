name: Deploy Club News to GitHub Pages

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: club-news-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application and RSS collector
        run: |
          node --check site/app.js
          node --check scripts/collect-news.mjs
          node -e "JSON.parse(require('fs').readFileSync('site/config/teams.json','utf8'))"
      - name: Collect KBO news RSS feeds
        run: node scripts/collect-news.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
